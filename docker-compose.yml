version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - enma_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: enma_candles
      POSTGRES_USER: enma
      POSTGRES_PASSWORD: enma_dev_password
    volumes:
      - enma_timescale_data:/var/lib/postgresql/data
      - ./docker/timescale/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enma -d enma_candles"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  engine:
    build: ./engine
    ports:
      - "8000:8000"
    volumes: []
    env_file:
      - ./.env
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: ./engine
          target: /app
          ignore:
            - __pycache__
            - "*.pyc"
            - .pytest_cache
        - action: rebuild
          path: ./engine/requirements.txt

  server:
    build: ./server
    ports:
      - "5000:5000"
    volumes:
      - enma_server_node_modules:/app/node_modules
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    develop:
      watch:
        - action: sync
          path: ./server/src
          target: /app/src
        - action: rebuild
          path: ./server/package.json

  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - enma_client_node_modules:/app/node_modules
    env_file:
      - ./.env
    depends_on:
      server:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./client/src
          target: /app/src
        - action: sync
          path: ./client/public
          target: /app/public
        - action: sync
          path: ./client/index.html
          target: /app/index.html
        - action: rebuild
          path: ./client/package.json

volumes:
  enma_redis_data:
  enma_timescale_data:
  enma_server_node_modules:
  enma_client_node_modules:
