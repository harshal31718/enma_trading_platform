version: "3.9"

services:
  # Local dev-only MongoDB (workspace/plan/2_safety-net-and-guardrails.md's
  # "local dev shares production's Atlas cluster" flag, resolved 2026-07-18):
  # local dev now runs its own database, never the production Atlas cluster.
  # Not present in docker-compose.prod.yml — the deployed VPS keeps pointing
  # at Atlas via its own .env, untouched by this file.
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - enma_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - enma_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  timescaledb:
    # Plan 4 Step 4.5 (SEC-7): pinned to the exact version already running in
    # this environment (was `latest-pg16`, which silently re-pulls a moving
    # target on any image rebuild — a schema/behavior change could land with
    # no warning). Bump deliberately, not implicitly.
    image: timescale/timescaledb:2.26.1-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: enma_candles
      POSTGRES_USER: enma
      POSTGRES_PASSWORD: enma_dev_password
    volumes:
      - enma_timescale_data:/var/lib/postgresql/data
      - ./docker/timescale/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enma -d enma_candles"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  engine:
    build: ./engine
    ports:
      - "8000:8000"
    volumes: []
    # Plan 4 Step 4.3 (SEC-4): scoped to exactly what the engine reads — not
    # the whole shared .env (which also holds JWT_SECRET, ENCRYPTION_KEY,
    # GOOGLE_CLIENT_SECRET, none of which the engine needs or should see).
    environment:
      PYTHON_ENV: ${PYTHON_ENV}
      ENGINE_PORT: ${ENGINE_PORT}
      ENGINE_API_KEY: ${ENGINE_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SERVER_URL: ${SERVER_URL}
      CLIENT_URL: ${CLIENT_URL}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      TIMESCALE_URL: ${TIMESCALE_URL}
      REDIS_URL: ${REDIS_URL}
      BINANCE_FETCH_DELAY_MS: ${BINANCE_FETCH_DELAY_MS}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Engine boot loads exchange rules + volume tiers + book tickers for
      # ~700 futures + ~3600 spot symbols (40-70s of httpx calls before
      # "Application startup complete"). At 30s it passed only by the retry
      # margin; a slow-network day would mark it unhealthy and cascade the
      # same abort down to server -> client. 90s gives real headroom.
      start_period: 90s
    develop:
      watch:
        - action: sync
          path: ./engine
          target: /app
          ignore:
            - __pycache__
            - "*.pyc"
            - .pytest_cache
        - action: rebuild
          path: ./engine/requirements.txt

  server:
    build: ./server
    ports:
      - "5000:5000"
    volumes:
      - enma_server_node_modules:/app/node_modules
    # Plan 4 Step 4.3 (SEC-4): scoped to exactly what the server reads.
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SERVER_URL: ${SERVER_URL}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      REDIS_URL: ${REDIS_URL}
      ENGINE_URL: ${ENGINE_URL}
      ENGINE_API_KEY: ${ENGINE_API_KEY}
      CLIENT_URL: ${CLIENT_URL}
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # start_period must exceed the CMD's on-boot `npm install` (the
      # enma_server_node_modules volume overlays the image's node_modules, so
      # npm resolve/audit re-runs every start — ~2 min on Docker Desktop for
      # Windows). At 20s compose marked the container unhealthy mid-install and
      # aborted the dependent client with "dependency failed to start". During
      # start_period, failing checks keep the container "starting" (not
      # "unhealthy"), so dependents wait instead of aborting; it flips to
      # healthy the instant the first check passes, so a fast boot is unaffected.
      start_period: 180s
    develop:
      watch:
        - action: sync
          path: ./server/src
          target: /app/src
        - action: rebuild
          path: ./server/package.json

  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - enma_client_node_modules:/app/node_modules
    # Plan 4 Step 4.3 (SEC-4): the client previously received the ENTIRE
    # shared .env — JWT_SECRET, ENCRYPTION_KEY, GOOGLE_CLIENT_SECRET, MONGO_URI,
    # all of it — into a Node process running Vite with ~15 third-party
    # dependencies, any one of which (via a compromised/malicious postinstall
    # script) could exfiltrate process.env. Only public VITE_* build vars now.
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    depends_on:
      server:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./client/src
          target: /app/src
        - action: sync
          path: ./client/public
          target: /app/public
        - action: sync
          path: ./client/index.html
          target: /app/index.html
        - action: rebuild
          path: ./client/package.json

volumes:
  enma_mongo_data:
  enma_redis_data:
  enma_timescale_data:
  enma_server_node_modules:
  enma_client_node_modules:
