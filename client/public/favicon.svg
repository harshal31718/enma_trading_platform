  <line x1="10.5" y1="8" x2="10.5" y2="26" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="9" y="14" width="3" height="10" rx="1" fill="url(#grad)"/>
  <!-- Candlestick 2 -->
  <line x1="16.5" y1="6" x2="16.5" y2="24" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="15" y="10" width="3" height="12" rx="1" fill="url(#grad)"/>
  <!-- Candlestick 3 -->
  <line x1="22.5" y1="4" x2="22.5" y2="20" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="21" y="7" width="3" height="10" rx="1" fill="url(#grad)"/>
</svg>
